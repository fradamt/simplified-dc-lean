name = "available-chain"
version = "0.1.0"
keywords = ["lean", "consensus", "model"]
defaultTargets = [
  "AvailableChainModel",
  "AvailableChainStatements",
  "AvailableChainLStar",
  "AvailableChainGridCO",
  "AvailableChainSA",
  "AvailableChainSAPC",
  "AvailableChainWitnesses",
  "AvailableChainFramework",
  "AvailableChainRegistry",
  "AvailableChainKit",
  "AvailableChainEngineV2",
  "AvailableChainKitV2",
  "AvailableChainSimplexFG",
  "AvailableChainKitFG",
  "AvailableChainFGSA",
  "AvailableChainGeneric",
  "AvailableChainFGSARun",
  "AvailableChainFGSAClaims",
  "AvailableChainFGSAProofs",
  "AvailableChainFGSAInhabit",
  "AvailableChainPCSA",
  "AvailableChainPCSARun",
  "AvailableChainPCSAClaims",
]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.flexible = false
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

# Generic execution engine and objects. No protocol.
[[lean_lib]]
name = "AvailableChainModel"

# The contract: interface, conditions, regimes, constants, properties, claims.
[[lean_lib]]
name = "AvailableChainStatements"

# Instance: Goldfish with L* locks (model, statements, proofs).
[[lean_lib]]
name = "AvailableChainLStar"

# Grid counted-obligations instance of the common contract.
[[lean_lib]]
name = "AvailableChainGridCO"

# Non-vacuity: sanity instance, regime witnesses, accumulation run.
[[lean_lib]]
name = "AvailableChainWitnesses"

# Slow arming with one release level.
[[lean_lib]]
name = "AvailableChainSA"

# Slow arming with persistent TA certificates.
[[lean_lib]]
name = "AvailableChainSAPC"

# Framework prototype (Phase 0): hooks, instances, claim catalog, certificates.
[[lean_lib]]
name = "AvailableChainFramework"

# Instances with certificates and refutations over the framework (L4), and tests.
[[lean_lib]]
name = "AvailableChainRegistry"

# Kit (L5): engine-generic lemmas and derived results. Imports Model and Statements only.
[[lean_lib]]
name = "AvailableChainKit"

# Engine v2 (L0, design §2): the root and every module under
# `Engine/`, `Conditions/`, `Laws/` and `Tests/` (plan 2a). One glob, `.*` (the
# root and all its submodules): Lake fails on a glob for a directory that does
# not exist yet.
[[lean_lib]]
name = "AvailableChainEngineV2"
globs = ["AvailableChainEngineV2.*"]

# Kit v2 (L5): engine lemmas over engine v2. Imports the v2 engine and narrow
# model modules only. One glob, `.*`: the root and every module, `Tests/`
# included (the root does not import the tests).
[[lean_lib]]
name = "AvailableChainKitV2"
globs = ["AvailableChainKitV2.*"]

# Simplex FG module SimplexFG.fj (LM): DC's FG without SG, FJ root rule. Definitions only.
[[lean_lib]]
name = "AvailableChainSimplexFG"

# Kit.FG (L5): proofs over SimplexFG.fj.
[[lean_lib]]
name = "AvailableChainKitFG"
# The root and every module, `Tests/` included (regression tests such as
# Tests/Frame and Tests/CertHeight are built by every gate).
globs = ["AvailableChainKitFG.*"]

# FG-SA composite model (LM), store statements and store proofs
# (docs/plans/2026-09-29-fgsa-model-store.md). No engine binding.
[[lean_lib]]
name = "AvailableChainFGSA"
# One glob, `.*` (B7-GLOBS): the root and every module, `Tests/` included, so a
# test module needs no root import (backlog C23, lead 2026-10-01; check-fgsa.sh).
globs = ["AvailableChainFGSA.*"]

# Generic layer (GLY A): Pure, V2 and AC statements and proofs, shared by SA and
# FG-SA. One glob, `.*`: the root and every module, `Tests/` included (the root
# does not import the tests).
[[lean_lib]]
name = "AvailableChainGeneric"
globs = ["AvailableChainGeneric.*"]

# FG-SA run layer on engine v2: protocol, label families, isolation, and
# the run lift of the store facts (docs/plans/2026-09-29-fgsa-composition-t7-t1.md,
# T7). Checked by scripts/check-fgsa-run.sh. The store library above keeps its
# own boundary and its own check.
[[lean_lib]]
name = "AvailableChainFGSARun"
globs = ["AvailableChainFGSARun.*"]

# Support code of the check scripts (scripts/check-fgsa.sh,
# scripts/check-fgsa-run.sh): the owner map of generated constants. Imports only
# `Lean`; no protocol library may import it (a check in scripts/check-fgsa.sh).
# Not a default target: the check scripts build it first.
[[lean_lib]]
name = "AvailableChainCheckSupport"
srcDir = "scripts"
globs = ["AvailableChainCheckSupport.+"]

# FG-SA claims work: root and all modules, including the separate Tests target.
[[lean_lib]]
name = "AvailableChainFGSAClaims"
globs = ["AvailableChainFGSAClaims.*"]

[[lean_lib]]
name = "AvailableChainFGSAClaimsTests"
roots = []
globs = ["AvailableChainFGSAClaims.Tests.+"]

# FG-SA claims work: root and all modules, including the separate Tests target.
[[lean_lib]]
name = "AvailableChainFGSAProofs"
globs = ["AvailableChainFGSAProofs.*"]

[[lean_lib]]
name = "AvailableChainFGSAProofsTests"
roots = []
globs = ["AvailableChainFGSAProofs.Tests.+"]

# FG-SA claims work: root and all modules, including the separate Tests target.
[[lean_lib]]
name = "AvailableChainFGSAInhabit"
globs = ["AvailableChainFGSAInhabit.*"]

[[lean_lib]]
name = "AvailableChainFGSAInhabitTests"
roots = []
globs = ["AvailableChainFGSAInhabit.Tests.+"]

# PC-SA composite model (3n/4 version, pcsa-decisions.md): the FG-SA family
# with exact acks, PCs and the PC-first root. One glob, `.*` (B7-GLOBS): the
# root and every module, `Tests/` included, as AvailableChainFGSA.
[[lean_lib]]
name = "AvailableChainPCSA"
globs = ["AvailableChainPCSA.*"]

# PC-SA run layer on engine v2: protocol, label families (Model only in M1).
[[lean_lib]]
name = "AvailableChainPCSARun"
globs = ["AvailableChainPCSARun.*"]

# PC-SA claims: run regimes, reads and the Statements-layer claim Props.
[[lean_lib]]
name = "AvailableChainPCSAClaims"
globs = ["AvailableChainPCSAClaims.*"]
